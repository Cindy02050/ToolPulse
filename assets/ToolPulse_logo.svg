<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="2172" height="724" viewBox="0 0 2172 724" role="img" aria-labelledby="title desc">
  <title id="title">ToolPulse logo</title>
  <desc id="desc">Rounded navy open loop with an autonomous agent node and a short teal pulse, followed by the ToolPulse wordmark. Transparent background; pure vector paths.</desc>
  <g id="symbol">
    <!-- Continuous tool-interaction loop with one intentional opening. -->
    <path id="tool-loop" d="M 388 217 A 184 184 0 1 0 508 320" fill="none" stroke="#172B4D" stroke-width="46" stroke-linecap="round"/>
    <!-- The independent agent node remains separate from its environment. -->
    <circle id="agent-node" cx="342" cy="393" r="49" fill="#172B4D"/>
    <!-- Short, timely guidance signal. -->
    <path id="pulse" d="M 422 260 L 476 204 L 515 261 L 601 261" fill="none" stroke="#16B8A6" stroke-width="44" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
