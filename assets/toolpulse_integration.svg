<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="848" viewBox="0 100 1280 848" role="img" aria-labelledby="title desc">
  <title id="title">ToolPulse: shared support across agent frameworks</title>
  <desc id="desc">Minimal ReAct and SWE-agent connect through their own action parsers, semantic labelers, and host lifecycle hooks to the same reusable ToolPulse support layer. A custom framework can use the same interfaces. Orange identifies framework-specific adaptation; blue identifies shared state tracking, symptom detection, and assistance. Dashed boundaries and connections identify extension points for custom frameworks, detectors, and hint providers. Hosts control tool execution and deliver feedback.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9 Z" fill="#526477"/>
    </marker>
    <marker id="blue-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9 Z" fill="#2673b8"/>
    </marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #203249; }
      .section { font-size: 18px; font-weight: 700; letter-spacing: 1.4px; }
      .heading { font-size: 24px; font-weight: 700; }
      .body { font-size: 20px; }
      .small { font-size: 18px; fill: #526477; }
      .api { font-size: 19px; font-family: Consolas, Menlo, monospace; }
      .host { fill: #f3f5f8; stroke: #b7c2cf; stroke-width: 2; }
      .adapt { fill: #fff4e5; stroke: #c88220; stroke-width: 2; }
      .shared { fill: #edf5fd; stroke: #2673b8; stroke-width: 2; }
      .component { fill: #ffffff; stroke: #7ba9d4; stroke-width: 2; }
      .extension { stroke-dasharray: 8 6; }
      .link { fill: none; stroke: #526477; stroke-width: 2.5; marker-start: url(#arrow); marker-end: url(#arrow); }
      .flow { fill: none; stroke: #2673b8; stroke-width: 2.5; marker-end: url(#blue-arrow); }
      .plug { fill: none; stroke: #2673b8; stroke-width: 2.5; stroke-dasharray: 7 5; marker-end: url(#blue-arrow); }
    </style>
  </defs>

  <rect y="100" width="1280" height="848" rx="16" fill="#ffffff"/>

  <!-- The hosts retain execution and feedback-delivery responsibility. -->
  <text x="48" y="128" class="section">AGENT FRAMEWORKS</text>
  <text x="1232" y="128" text-anchor="end" class="small">Hosts execute tools and deliver feedback</text>
  <g id="hosts" text-anchor="middle">
    <rect x="48" y="146" width="364" height="66" rx="12" class="host"/>
    <text x="230" y="187" class="heading">Minimal ReAct</text>
    <rect x="458" y="146" width="364" height="66" rx="12" class="host"/>
    <text x="640" y="187" class="heading">SWE-agent</text>
    <rect x="868" y="146" width="364" height="66" rx="12" class="host extension"/>
    <text x="1050" y="187" class="heading">Your agent / framework</text>
  </g>
  <path d="M 230 217 V 270" class="link"/>
  <path d="M 640 217 V 270" class="link"/>
  <path d="M 1050 217 V 270" class="link extension"/>

  <!-- Orange marks the parts supplied or selected for each framework. -->
  <text x="48" y="257" class="section" style="fill:#9b5d10">ADAPTATION</text>
  <g id="adaptation" text-anchor="middle">
    <rect x="48" y="278" width="364" height="166" rx="12" class="adapt"/>
    <text x="230" y="312" class="body" font-weight="700">MinimalReactParser</text>
    <text x="230" y="343" class="body" font-weight="700">MinimalReactLabeler</text>
    <line x1="70" y1="361" x2="390" y2="361" stroke="#e4c99f"/>
    <text x="230" y="390" class="body">Pre / post hooks</text>
    <text x="230" y="419" class="small">Direct integration in the ReAct loop</text>

    <rect x="458" y="278" width="364" height="166" rx="12" class="adapt"/>
    <text x="640" y="312" class="body" font-weight="700">SWEAgentActionParser</text>
    <text x="640" y="343" class="body" font-weight="700">RepoLabeler · Python / Java / C++</text>
    <line x1="480" y1="361" x2="800" y2="361" stroke="#e4c99f"/>
    <text x="640" y="390" class="body">Execution + message lifecycle</text>
    <text x="640" y="419" class="small">ToolPulseSWEAgent adapter</text>

    <rect x="868" y="278" width="364" height="166" rx="12" class="adapt extension"/>
    <text x="1050" y="312" class="body" font-weight="700">Custom ActionParser</text>
    <text x="1050" y="343" class="body" font-weight="700">Custom ActionLabeler</text>
    <line x1="890" y1="361" x2="1210" y2="361" stroke="#e4c99f"/>
    <text x="1050" y="390" class="body">Pre / post hooks + feedback</text>
    <text x="1050" y="419" class="small">Integration in your host lifecycle</text>
  </g>
  <path d="M 230 448 V 478" class="link"/>
  <path d="M 640 448 V 478" class="link"/>
  <path d="M 1050 448 V 478" class="link extension"/>

  <!-- One foundation is reused by every integration; these are components,
       not a literal ordering of every pre- and post-execution operation. -->
  <rect x="48" y="482" width="1184" height="386" rx="16" class="shared"/>
  <text x="72" y="521" class="heading" style="fill:#1b5b94">ToolPulse · Reusable support layer</text>
  <text x="1208" y="521" text-anchor="end" class="small" style="fill:#1b5b94">Shared across integrations</text>
  <rect x="72" y="558" width="1136" height="60" rx="10" class="component"/>
  <text x="96" y="595" class="body" font-weight="700">Interaction interface</text>
  <text x="402" y="595" class="api">inspect_action()</text>
  <text x="669" y="595" class="api">observe_step()</text>
  <text x="916" y="595" class="api">assemble_observation()</text>

  <g id="shared-components">
    <rect x="72" y="647" width="336" height="126" rx="10" class="component"/>
    <text x="96" y="684" class="heading">State-flow tracking</text>
    <text x="96" y="719" class="body">Trajectory · file access · failures</text>
    <text x="96" y="747" class="body">Semantic history · step features</text>

    <rect x="472" y="647" width="336" height="126" rx="10" class="component"/>
    <text x="496" y="684" class="heading">Symptom Detector</text>
    <text x="496" y="719" class="body">Pre-checks + post-analysis</text>
    <text x="496" y="747" class="body">MultiGranularityDetector</text>

    <rect x="872" y="647" width="336" height="126" rx="10" class="component"/>
    <text x="896" y="684" class="heading">Assistance</text>
    <text x="896" y="719" class="body">HintProvider · template or LLM</text>
    <text x="896" y="747" class="body">HintSink · hint delivery</text>
  </g>
  <path d="M 240 618 V 641" class="flow"/>
  <path d="M 640 618 V 641" class="flow"/>
  <path d="M 414 710 H 465" class="flow"/>
  <path d="M 814 710 H 865" class="flow"/>
  <path d="M 1040 641 V 625" class="flow"/>

  <text x="96" y="831" class="small">Reusable state + replaceable components</text>
  <rect x="502" y="810" width="276" height="38" rx="8" class="component extension"/>
  <text x="640" y="836" text-anchor="middle" class="body">Custom Detector</text>
  <path d="M 640 805 V 780" class="plug"/>
  <rect x="900" y="810" width="280" height="38" rx="8" class="component extension"/>
  <text x="1040" y="836" text-anchor="middle" class="body">Custom HintProvider</text>
  <path d="M 1040 805 V 780" class="plug"/>

  <!-- Meaning is encoded in labels and line styles as well as color. -->
  <g id="legend">
    <rect x="48" y="904" width="20" height="20" rx="4" class="adapt"/>
    <text x="80" y="921" class="small">Framework-specific</text>
    <rect x="310" y="904" width="20" height="20" rx="4" class="shared"/>
    <text x="342" y="921" class="small">Shared ToolPulse capabilities</text>
    <line x1="650" y1="914" x2="694" y2="914" stroke="#526477" stroke-width="2.5"/>
    <text x="706" y="921" class="small">Implemented integration</text>
    <line x1="977" y1="914" x2="1021" y2="914" stroke="#526477" stroke-width="2.5" stroke-dasharray="7 5"/>
    <text x="1033" y="921" class="small">Extension point</text>
  </g>
</svg>
